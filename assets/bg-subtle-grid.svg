<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" aria-hidden="true">
  <!-- Subtle scientific coordinate dots & precision crosshairs -->
  <circle cx="40" cy="40" r="1.15" fill="#0284c7" fill-opacity="0.14"/>
  <circle cx="120" cy="40" r="1" fill="#64748b" fill-opacity="0.14"/>
  <circle cx="40" cy="120" r="1" fill="#64748b" fill-opacity="0.14"/>
  <circle cx="120" cy="120" r="1.15" fill="#059669" fill-opacity="0.13"/>
  <circle cx="80" cy="80" r="0.9" fill="#0284c7" fill-opacity="0.12"/>

  <!-- Precision hairline grid borders -->
  <path d="M160 0H0V160" stroke="#0284c7" stroke-width="0.6" stroke-opacity="0.06"/>

  <!-- Minimal scientific calibration ticks at center -->
  <g stroke="#0284c7" stroke-width="0.85" stroke-opacity="0.12">
    <line x1="76" y1="80" x2="84" y2="80"/>
    <line x1="80" y1="76" x2="80" y2="84"/>
  </g>

  <!-- Faint hexagonal molecular ring outline -->
  <polygon points="80,22 104,36 104,64 80,78 56,64 56,36" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.055" stroke-dasharray="3 4"/>
</svg>
