  <script>
    // Copyright year
    document.getElementById('copyright-year').textContent = new Date().getFullYear();

    // Lightbox
    (function () {
      const lightbox   = document.getElementById('lightbox');
      const lbImg      = document.getElementById('lightbox-img');
      const lbCounter  = document.getElementById('lightbox-counter');
      const lbClose    = document.getElementById('lightbox-close');
      const lbPrev     = document.getElementById('lightbox-prev');
      const lbNext     = document.getElementById('lightbox-next');
      const lbInner    = document.getElementById('lightbox-inner');

      // Collect all gallery items
      const items = Array.from(document.querySelectorAll('.gallery-item'));
      let current = 0;
      let lastFocused = null;

      function getFullSrc(item) {
        // Prefer WebP source if available
        const source = item.querySelector('source[type="image/webp"]');
        const img    = item.querySelector('img');
        return source ? source.getAttribute('srcset') : img.src;
      }

      function getAlt(item) {
        return item.querySelector('img').getAttribute('alt') || '';
      }

      function openLightbox(index) {
        current = index;
        lastFocused = document.activeElement;
        updateLightbox();
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        lbClose.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        lbImg.src = '';
        if (lastFocused) lastFocused.focus();
      }

      function updateLightbox() {
        const item = items[current];
        lbImg.src     = getFullSrc(item);
        lbImg.alt     = getAlt(item);
        lbCounter.textContent = (current + 1) + ' / ' + items.length;
      }

      function showPrev() {
        current = (current - 1 + items.length) % items.length;
        updateLightbox();
      }

      function showNext() {
        current = (current + 1) % items.length;
        updateLightbox();
      }

      // Bind gallery items
      items.forEach(function (item, index) {
        item.addEventListener('click', function () { openLightbox(index); });
        item.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openLightbox(index);
          }
        });
      });

      // Controls
      lbClose.addEventListener('click', closeLightbox);
      lbPrev.addEventListener('click', showPrev);
      lbNext.addEventListener('click', showNext);

      // Click backdrop to close (but not the image itself)
      lightbox.addEventListener('click', function (e) {
        if (!lbInner.contains(e.target) && e.target !== lbPrev && e.target !== lbNext &&
            !lbPrev.contains(e.target) && !lbNext.contains(e.target)) {
          closeLightbox();
        }
      });

      // Keyboard navigation
      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape')      closeLightbox();
        if (e.key === 'ArrowLeft')   showPrev();
        if (e.key === 'ArrowRight')  showNext();
      });

      // Focus trap inside lightbox
      lightbox.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        const focusable = lightbox.querySelectorAll('button, [tabindex="0"]');
        const first = focusable[0];
        const last  = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last)  { e.preventDefault(); first.focus(); }
        }
      });
    })();
  </script>
